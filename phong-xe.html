<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh sách Phòng & Xe | Team Building 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#003b73;--blue:#005596;--sky:#e8f4fd;--ice:#f7fbff;--white:#fff;--ink:#1a2332;--muted:#64748b;--line:#dbe5ef;--gold:#f59e0b;--shadow:0 14px 40px rgba(0,59,115,.1)}
html{scroll-behavior:smooth}body{min-height:100dvh;background:var(--ice);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.55}a{color:inherit;text-decoration:none}button{font:inherit}
.loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(135deg,#061b3a,#003b73 62%,#005596);color:#fff;transition:opacity .45s,visibility .45s}.loader.hide{opacity:0;visibility:hidden;pointer-events:none}.loader-in{text-align:center;padding:24px}.loader-icon{font-size:3.5rem;animation:loadMove 1.1s ease-in-out infinite}.loader-name{margin-top:14px;font-weight:800;font-size:1.05rem;letter-spacing:1px}.loader-note{margin-top:4px;font-size:.75rem;opacity:.7}.loader-bar{width:220px;height:4px;margin:20px auto 0;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}.loader-bar:before{content:'';display:block;width:45%;height:100%;border-radius:inherit;background:#fff;animation:loadBar 1.1s ease-in-out infinite}@keyframes loadMove{50%{transform:translateY(-8px)}}@keyframes loadBar{from{transform:translateX(-110%)}to{transform:translateX(250%)}}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.top-in{width:min(1180px,calc(100% - 32px));height:64px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;color:var(--navy);letter-spacing:1px}.back{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;color:var(--navy);font-size:.78rem;font-weight:700;background:#fff;transition:.2s}.back:hover{border-color:var(--blue);transform:translateY(-1px)}.back:active{transform:scale(.98)}
.hero{background:linear-gradient(135deg,#061b3a,#003b73 66%,#005596);color:#fff;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.1) 1px,transparent 1px);background-size:28px 28px;opacity:.32}.hero-in{position:relative;z-index:1;width:min(1180px,calc(100% - 32px));margin:auto;padding:68px 0 60px}.eyebrow{font:500 .68rem 'DM Mono',monospace;letter-spacing:3px;text-transform:uppercase;opacity:.72}.hero h1{font-size:clamp(2rem,5vw,4.2rem);line-height:1.06;margin-top:12px;letter-spacing:0}.hero p{max-width:620px;margin-top:14px;font-size:.95rem;opacity:.82}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.meta span{padding:8px 12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.1);font-size:.72rem;font-weight:700}
.main{width:min(1180px,calc(100% - 32px));margin:auto;padding:42px 0 64px}.tabs{display:inline-grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;border:1px solid var(--line);border-radius:14px;background:#edf3f8}.tab{min-width:170px;padding:11px 18px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:.8rem;font-weight:800;cursor:pointer;transition:.2s}.tab:hover{color:var(--navy)}.tab:active{transform:scale(.98)}.tab.on{background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(0,59,115,.18)}
.panel{display:none;margin-top:24px}.panel.on{display:block;animation:enter .35s ease}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}@keyframes enter{from{opacity:0;transform:translateY(10px)}}
.card{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow)}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line)}.identity{display:flex;align-items:center;gap:12px;min-width:0}.icon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:var(--sky);font-size:1.4rem}.name{font-size:1rem;font-weight:800}.sub{margin-top:2px;color:var(--muted);font-size:.7rem}.count{font:500 .63rem 'DM Mono',monospace;color:var(--navy);white-space:nowrap}.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px 20px;background:var(--ice);border-bottom:1px solid var(--line)}.label{font-size:.58rem;font-weight:700;color:#8291a5;text-transform:uppercase;letter-spacing:.7px}.value{margin-top:3px;font-size:.78rem;font-weight:700}.value a{color:var(--blue)}.members{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:16px 20px}.member{display:flex;align-items:center;gap:9px;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--ice)}.no{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto;background:var(--sky);color:var(--navy);font:500 .6rem 'DM Mono',monospace}.member-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.72rem;font-weight:700}.pending{padding:22px;text-align:center;color:var(--muted);font-size:.73rem}.empty{min-height:280px;border:1px dashed #b7c6d6;border-radius:16px;background:#fff;display:grid;place-items:center;text-align:center;padding:28px}.empty-icon{font-size:2.4rem}.empty-title{margin-top:8px;font-size:1rem;font-weight:800}.empty-text{max-width:380px;margin-top:5px;color:var(--muted);font-size:.78rem}.footer{padding:18px 16px;text-align:center;background:#1a2332;color:#fff;font-size:.72rem;font-weight:700;letter-spacing:1px}
@media(max-width:760px){.hero-in{padding:48px 0 44px}.grid{grid-template-columns:1fr}.brand{font-size:.78rem}.back{padding:8px 10px;font-size:.68rem}.main{padding-top:28px}.tabs{width:100%}.tab{min-width:0;padding:10px 8px}.members{grid-template-columns:1fr}}
@media(max-width:430px){.top-in,.hero-in,.main{width:min(100% - 24px,1180px)}.info{grid-template-columns:1fr}.card-head,.info,.members{padding-left:14px;padding-right:14px}.hero h1{font-size:1.8rem}.hero p{font-size:.82rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:0s!important}.loader{display:none}}
</style>
</head>
<body>
<div class="loader" id="loader" aria-live="polite"><div class="loader-in"><div class="loader-icon">🚌</div><div class="loader-name">Đang mở danh sách Phòng &amp; Xe</div><div class="loader-note">Team Building 2026</div><div class="loader-bar"></div></div></div>

<header class="top"><div class="top-in"><div class="brand">NHÀ MÁY AMATA</div><a class="back" href="index.html">← Quay lại Sổ tay</a></div></header>

<section class="hero"><div class="hero-in"><div class="eyebrow">Thông tin đoàn</div><h1>Danh sách Phòng &amp; Xe</h1><p>Tra cứu phân bổ xe, trưởng xe, số điện thoại và thông tin phòng của chương trình.</p><div class="meta"><span>21 - 22/08/2026</span><span>Vũng Tàu</span></div></div></section>

<main class="main">
  <div class="tabs" role="tablist" aria-label="Chọn danh sách Phòng hoặc Xe">
    <button class="tab on" type="button" role="tab" aria-selected="true" aria-controls="vehiclePanel" onclick="showPanel('vehicle',this)">🚌 Danh sách xe</button>
    <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="roomPanel" onclick="showPanel('room',this)">🏨 Danh sách phòng</button>
  </div>
  <section class="panel on" id="vehiclePanel" role="tabpanel"><div class="grid" id="vehicleList"></div></section>
  <section class="panel" id="roomPanel" role="tabpanel"><div class="grid" id="roomList"></div></section>
</main>

<footer class="footer">NHÀ MÁY AMATA</footer>

<script>
/* ==========================================
   CẬP NHẬT DANH SÁCH PHÒNG VÀ XE TẠI ĐÂY
========================================== */
const allocationData={
  vehicles:[
    {name:"Xe 1",leader:"Đỗ Quốc Thắng",phone:"0937 507 370",plate:"Sẽ cập nhật",members:[]},
    {name:"Xe 2",leader:"Đoàn Quang Vinh",phone:"0966 921 638",plate:"Sẽ cập nhật",members:[]},
    {name:"Xe 3",leader:"Nguyễn Xuân Giáp",phone:"0903 005 883",plate:"Sẽ cập nhật",members:[]},
    {name:"Xe 4",leader:"Nguyễn Quốc Bảo",phone:"0903 333 007",plate:"Sẽ cập nhật",members:[]}
  ],
  rooms:[]
};

function render(){
  document.getElementById("vehicleList").innerHTML=allocationData.vehicles.length?allocationData.vehicles.map(v=>`
    <article class="card"><div class="card-head"><div class="identity"><div class="icon">🚌</div><div><div class="name">${v.name}</div><div class="sub">Phân bổ di chuyển</div></div></div><div class="count">${v.members.length} thành viên</div></div>
    <div class="info"><div><div class="label">Trưởng xe</div><div class="value">${v.leader}</div></div><div><div class="label">Điện thoại</div><div class="value"><a href="tel:${v.phone.replace(/\s/g,'')}">${v.phone}</a></div></div><div><div class="label">Biển số xe</div><div class="value">${v.plate}</div></div></div>
    ${v.members.length?`<div class="members">${v.members.map((m,i)=>`<div class="member"><div class="no">${String(i+1).padStart(2,'0')}</div><div class="member-name">${m}</div></div>`).join("")}</div>`:`<div class="pending">Danh sách nhân viên đang được cập nhật.</div>`}</article>`).join(""):`<div class="empty"><div><div class="empty-icon">🚌</div><div class="empty-title">Danh sách xe đang được cập nhật</div><div class="empty-text">Thông tin xe và nhân viên sẽ hiển thị tại đây.</div></div></div>`;
  document.getElementById("roomList").innerHTML=allocationData.rooms.length?allocationData.rooms.map(r=>`
    <article class="card"><div class="card-head"><div class="identity"><div class="icon">🏨</div><div><div class="name">Phòng ${r.number}</div><div class="sub">${r.type||'Phòng khách sạn'}</div></div></div><div class="count">${r.members.length} người</div></div>
    ${r.members.length?`<div class="members">${r.members.map((m,i)=>`<div class="member"><div class="no">${String(i+1).padStart(2,'0')}</div><div class="member-name">${m}</div></div>`).join("")}</div>`:`<div class="pending">Danh sách người ở đang được cập nhật.</div>`}</article>`).join(""):`<div class="empty"><div><div class="empty-icon">🏨</div><div class="empty-title">Danh sách phòng đang được cập nhật</div><div class="empty-text">Số phòng và người ở sẽ hiển thị tại đây.</div></div></div>`;
}

function showPanel(type,button){
  document.querySelectorAll(".tab").forEach(tab=>{const active=tab===button;tab.classList.toggle("on",active);tab.setAttribute("aria-selected",active)});
  document.getElementById("vehiclePanel").classList.toggle("on",type==="vehicle");
  document.getElementById("roomPanel").classList.toggle("on",type==="room");
}

render();
window.addEventListener("load",()=>setTimeout(()=>document.getElementById("loader").classList.add("hide"),650),{once:true});
</script>
</body>
</html>
